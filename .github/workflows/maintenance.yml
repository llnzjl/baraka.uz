name: Private booking maintenance

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: booking-maintenance
  cancel-in-progress: false

jobs:
  records:
    runs-on: ubuntu-latest
    steps:
      - name: Retry private text exports
        env:
          API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [[ -z "$API_BASE_URL" || -z "$CRON_SECRET" ]]; then
            echo "API_BASE_URL and CRON_SECRET must be configured to run maintenance."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${API_BASE_URL%/}/api/jobs/records"

  retention:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Delete expired reservation data
        env:
          API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [[ -z "$API_BASE_URL" || -z "$CRON_SECRET" ]]; then
            echo "API_BASE_URL and CRON_SECRET must be configured to run maintenance."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${API_BASE_URL%/}/api/jobs/retention"
