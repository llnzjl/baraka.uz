name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      NEXT_PUBLIC_GITHUB_PAGES: "true"
      NEXT_PUBLIC_BASE_PATH: /baraka
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Run SQLite concurrency and workflow tests
        run: npm run test:db
      - name: Report backend configuration status
        shell: bash
        run: |
          if [[ -z "$NEXT_PUBLIC_API_BASE_URL" || -z "$NEXT_PUBLIC_TURNSTILE_SITE_KEY" ]]; then
            echo "::warning::Deno Deploy API URL or Turnstile public site key is missing. The site publishes, but sign-in, reservations and ordering remain unavailable until configured."
          fi
      - name: Prepare the static public site
        shell: bash
        run: |
          # Pages cannot host Next.js APIs; those run in Deno Deploy.
          rm -rf src/app/api src/app/admin/credentials 'src/app/blog/[blogId]'
      - name: Build static site
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
